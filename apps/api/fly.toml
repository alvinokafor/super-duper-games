# Deploy from the repo root, so the shared packages are in the build:
#   fly deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
app = "lagos-property-api"
primary_region = "lhr"

[env]
  PORT = "8080"
  SUPABASE_URL = "https://suzhmczhjoyalrctwjnt.supabase.co"

# The turn timer runs inside the API, so a machine must always be on.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
